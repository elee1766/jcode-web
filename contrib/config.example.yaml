# ~/.config/jcode-web/config.yaml

# Bind to localhost and put it behind Tailscale (tailscale serve) for remote use.
listen: "127.0.0.1:7650"
# data_dir: "/home/you/.local/state/jcode-web"

# Defaults to $XDG_RUNTIME_DIR/jcode.sock and jcode-debug.sock.
# main_socket: "/run/user/1000/jcode.sock"
# debug_socket: "/run/user/1000/jcode-debug.sock"

poll_interval: "3s"
retention: "720h"
# Close an idle upstream attachment after this long with no viewers.
attach_linger: "2m"

push_subject: "mailto:you@example.com"
log_level: "info"

# AI summaries of sessions and activity. Any OpenAI-compatible endpoint.
# Use a small fast model. Requests run one at a time.
summary:
  enabled: true
  base_url: "http://madobe:1234/v1"
  model: "openai/gpt-oss-20b"
  # api_key: ""
  reasoning_effort: "low"
  max_tokens: 400
  timeout: "60s"
